<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Produk & Dashboard Interaktif</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <header class="main-header">
            <h1><i class="fa-solid => fa-store"></i> Dashboard & Katalog Produk</h1>
            <p>Integrasi Fetch API DummyJSON dan Manipulasi DOM Interaktif</p>
        </header>

        <!-- SEKSI 1: FETCH API PRODUK -->
        <section class="card">
            <div class="card-header">
                <h2><i class="fa-solid fa-boxes-stacked"></i> Katalog Produk Online</h2>
                <button id="load-products" class="btn btn-primary">
                    <i class="fa-solid fa-rotate-right"></i> Muat Data Produk
                </button>
            </div>

            <!-- Indicator Loading & Error -->
            <div id="loading" class="loading-state hidden">
                <div class="spinner"></div>
                <p>Sedang mengambil data produk dari server...</p>
            </div>
            
            <div id="error-message" class="alert alert-danger hidden"></div>

            <!-- Container Produk -->
            <div id="product-container" class="product-grid"></div>
        </section>

        <!-- SEKSI 2: FORM & EVENT HANDLING -->
        <section class="card">
            <div class="card-header">
                <h2><i class="fa-solid fa-pen-to-square"></i> Tambah Produk Baru</h2>
            </div>
            
            <form id="product-form" novalidate>
                <div class="form-row">
                    <div class="form-group">
                        <label for="prod-name"><i class="fa-solid fa-tag"></i> Nama Produk</label>
                        <input type="text" id="prod-name" placeholder="Masukkan nama produk...">
                    </div>
                    <div class="form-group">
                        <label for="prod-price"><i class="fa-solid fa-dollar-sign"></i> Harga (USD)</label>
                        <input type="number" id="prod-price" placeholder="Contoh: 49.99">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-success">
                    <i class="fa-solid fa-plus"></i> Simpan Produk
                </button>
            </form>

            <div id="form-feedback" class="alert hidden"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
